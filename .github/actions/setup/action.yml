name: Setup
description: Install the .NET SDK pinned by src/global.json, plus optional workloads and Java.

inputs:
  workloads:
    description: Space-separated .NET workloads to install. Empty skips the install.
    required: false
    default: ''
  java-version:
    description: Microsoft Build of OpenJDK version to install. Empty skips Java.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure .NET environment
      shell: bash
      run: |
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=true" >> "$GITHUB_ENV"
        echo "DOTNET_NOLOGO=true" >> "$GITHUB_ENV"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup Java
      if: inputs.java-version != ''
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: microsoft
        java-version: ${{ inputs.java-version }}

    - name: Install workloads
      if: inputs.workloads != ''
      shell: bash
      env:
        WORKLOADS: ${{ inputs.workloads }}
      run: dotnet workload install $WORKLOADS
