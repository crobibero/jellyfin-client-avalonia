name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    env:
      # XamlStyler targets an older runtime than the installed SDK.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cache-key: lint

      - name: Lint XAML
        working-directory: ./src
        run: |
          dotnet tool restore
          dotnet xstyler --recursive --directory . --passive

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cache-key: test

      - name: Test
        working-directory: ./src
        run: dotnet test --project Jellyfin.Mvvm.Tests

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT links against the runner's glibc, so building on an older Ubuntu lets the binary run on older
          # distributions. It cannot cross-compile on Linux, so linux-arm64 builds on an arm64 runner.
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-2025
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26
            rid: osx-x64
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.rid }}
      runs-on: ${{ matrix.os }}
      project: Jellyfin.Avalonia.Desktop
      rid: ${{ matrix.rid }}
      # Native AOT links with clang and lld; StaticLink.Avalonia links fontconfig.
      apt-packages: clang lld zlib1g-dev libfontconfig-dev
      artifact: '*'

  android:
    strategy:
      fail-fast: false
      matrix:
        rid: [ android-arm64, android-arm, android-x64 ]
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.rid }}
      runs-on: ubuntu-26.04
      project: Jellyfin.Avalonia.Android
      framework: net10.0-android
      rid: ${{ matrix.rid }}
      workloads: android
      java-version: '21'
      args: -p:ApplicationVersion=${{ github.run_number }} -p:AcceptAndroidSdkLicenses=True
      artifact: '*.apk'

  browser:
    uses: ./.github/workflows/build.yml
    with:
      name: browser
      runs-on: ubuntu-26.04
      project: Jellyfin.Avalonia.Browser
      workloads: wasm-tools
      node-version-file: src/Jellyfin.Avalonia.Browser/.nvmrc
      artifact: wwwroot

  pages:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [ test, browser ]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jellyfin-avalonia-browser
          path: site

      # Pages compresses responses itself and never serves the precompressed copies.
      - name: Remove precompressed files
        run: find site -type f \( -name '*.br' -o -name '*.gz' \) -delete

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Signed device builds need certificates, CI verifies the simulator build.
  ios:
    uses: ./.github/workflows/build.yml
    with:
      name: ios
      runs-on: xcode-27
      project: Jellyfin.Avalonia.iOS
      command: build
      framework: net10.0-ios
      rid: iossimulator-arm64
      workloads: ios
