name: Build Android

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: microsoft
          java-version: 21

      - name: Install workload
        run: dotnet workload install android

      - name: Publish APK
        working-directory: ./src
        run: |
          dotnet publish Jellyfin.Avalonia.Android -c Release -f net10.0-android \
            -p:ApplicationVersion=$GITHUB_RUN_NUMBER -p:Version=0.1.$GITHUB_RUN_NUMBER \
            -p:AcceptAndroidSdkLicenses=True --output artifacts/android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfin-avalonia-android
          path: src/artifacts/android/*.apk
