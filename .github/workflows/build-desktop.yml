name: Build Desktop

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: ./src
        run: dotnet test --project Jellyfin.Mvvm.Tests

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-2025
            rid: win-arm64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: ./src
        shell: bash
        run: |
          version="0.1.$GITHUB_RUN_NUMBER"
          dotnet publish Jellyfin.Avalonia.Desktop -c Release -r ${{ matrix.rid }} -p:Version=$version --output artifacts/jellyfin-avalonia-${{ matrix.rid }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfin-avalonia-${{ matrix.rid }}
          path: src/artifacts/jellyfin-avalonia-${{ matrix.rid }}
