name: Build Desktop

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: ./src
        run: dotnet test --project Jellyfin.Mvvm.Tests

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-2025
            rid: win-arm64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: ./src
        shell: bash
        run: |
          version="0.1.$GITHUB_RUN_NUMBER"
          dotnet publish Jellyfin.Avalonia.Desktop -c Release -r ${{ matrix.rid }} -p:Version=$version --output artifacts/jellyfin-avalonia-${{ matrix.rid }}

      - uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4
        with:
          name: jellyfin-avalonia-${{ matrix.rid }}
          path: src/artifacts/jellyfin-avalonia-${{ matrix.rid }}
