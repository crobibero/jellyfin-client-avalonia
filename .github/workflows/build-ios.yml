name: Build iOS

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4
        with:
          dotnet-version: 10.0.x

      - name: Install workload
        run: dotnet workload install ios

      # Signed device builds need certificates, CI verifies the simulator build.
      - name: Build
        working-directory: ./src
        run: dotnet build Jellyfin.Avalonia.iOS -c Release -f net10.0-ios -r iossimulator-arm64
